# go-owl-migrate 示例配置
general:
  log_level: debug
  log_format: text

metadata:
  type: csv
  csv:
    path: ./testdata/csv/
    delimiter: ","
    encoding: utf-8
    has_header: true
    null_marker: "\\N"
    column_name_matching: case_insensitive

ddl:
  output_dir: ./output/ddl/
  target_dialect: postgres
  include_comments: true
  include_if_not_exists: true
  split_by_object: true
  schema_mapping:
    SCOTT: public
  table_filter:
    include: ["*"]
    exclude:
      glob: ["*_LOG", "TMP_*"]
      schemas:
        - "SYS"
        - "SYSTEM"
      tables: []
  type_overrides: {}
  partition:
    migrate: false

select_gen:
  output_dir: ./output/select/
  batch:
    method: cursor
    page_size: 5000

export:
  output_dir: ./output/data/
  format: csv  # Output format: csv (default), sql, xlsx
  csv:
    delimiter: ","
    quote_char: "\""
    encoding: utf-8
    header: true
    null_representation: "\\N"
  batch:
    method: cursor
    page_size: 5000
  parallel:
    enabled: true
    max_workers: 4
  tables:
    include: ["*"]

# ── 元数据对象导出（export-metadata；与上方 export 数据导出相互独立）──
# 用法示例：owl-migrate export-metadata -c migrate.example.yaml --format csv --scope all \
#           --objects views,sequences -o /tmp/meta
# 也可走 Web 端“元数据导出”页（等价 POST /api/v1/metadata/export）。
# 对象类型与范围是命令行 flag（--objects/--scope），不是 yaml 键（ExportConfig 无 objects/scope 字段）；
# export.tables.include 仍只用于数据导出与 DDL 表过滤，不作用于元数据导出。
# CSV 输出为 13 个规范文件词干：tables,columns,primary_keys,indexes,foreign_keys,views,mviews,
# sequences,synonyms,triggers,functions,packages,package_bodies（列规范见 docs/csv-format.md）。

import:  # 数据导入配置（仅 import 命令使用）
  # CSV 数据目录 —— 注意三个命令的入口不同：
  #   import        → 读本配置项 import.source_dir
  #   migrate       → 不读本项，内部用 --temp-dir 中转（默认 ./output/temp/）
  #   export insert → 不读本项，用命令行 -d/--data 指定
  source_dir: ./output/data/
  format: csv
  csv:
    delimiter: ","
    has_header: true
    null_marker: "\\N"
  target:
    truncate_before: false
  batch:
    commit_interval: 1000
    error_policy: skip_row
  parallel:
    enabled: true
    max_workers: 4
    respect_foreign_keys: true
  data_transforms:
    datetime_format: "yyyyMMddHHmmss"
    trim_strings: true
    null_if: ["NULL", "null", "\\N"]

# ── 在线增量迁移（owl-migrate online: init/sync/status/init-runner/archive）──
online:
  cdc:
    changelog_prefix: owl_chg_      # 变更表名 = owl_chg_<表名>
    tables: []                       # 为空 = 全部表
    apply: false                     # true = 直连源库执行; false = 输出脚本给 DBA 审阅
    script_dir: ./output/online/     # apply=false 时的脚本输出目录
    require_key: false               # true = 无主键/唯一键的表在 init 阶段直接拒绝
  sync:
    poll_interval: 1s                # 轮询变更表间隔
    batch_size: 500                  # 单批最大行数
    on_error: skip                   # skip/stop/retry, 默认 skip
    error_table: owl_sync_error      # 目标侧错误记录表
  files:                             # 仅 file-batch 目标适配器使用
    pending: ./online/pending/
    done:    ./online/done/
    failed:  ./online/failed/
  archive:
    enabled: true
    format: tar.gz                   # done/ 批处理后压缩成 tar.gz
    dir: ./online/archive/
  state:
    db: ./output/online/online.db   # 默认 JSON 写入 ./output/online/state.json（-tags sqlite3 用 SQLite）
