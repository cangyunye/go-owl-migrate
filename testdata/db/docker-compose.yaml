services:
  # MySQL 外置硬盘挂载
  mysql:
    image: mysql:latest
    pull_policy: never
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: default_db
      MYSQL_USER: app
      MYSQL_PASSWORD: app123456
    volumes:
      - /Volumes/ORICO2T/Users/sinvigil/mount/mysql/data:/var/lib/mysql
      - /Volumes/ORICO2T/Users/sinvigil/mount/mysql/conf:/etc/mysql/conf.d
      - /Volumes/ORICO2T/Users/sinvigil/mount/mysql/logs:/var/log/mysql
    ports:
      - "3306:3306"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Postgres 外置硬盘挂载
  postgres:
    image: postgres:15-alpine
    pull_policy: never
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres_db
    volumes:
      - /Volumes/ORICO2T/Users/sinvigil/mount/postgres/data:/var/lib/postgresql/data
      - /Volumes/ORICO2T/Users/sinvigil/mount/postgres/logs:/var/lib/postgresql/logs
    ports:
      - "5432:5432"
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  # OpenGauss 对应你 docker run 启动参数
  opengauss:
    image: opengauss/opengauss-server
    pull_policy: never
    container_name: opengauss
    privileged: true
    restart: always
    environment:
      GS_PASSWORD: OpenGauss@123
    volumes:
      - opengauss-data:/var/lib/opengauss
    ports:
      - "5433:5432"
    networks:
      - app-net
  # Oracle Free 23ai — ARM 原生镜像（Apple Silicon 不走 x86 模拟，避免 IPC 监听失败）
  # 走私有镜像源 docker.xuanyuan.run；ORACLE_DATABASE=XEPDB1 保持 PDB 名不变，DSN 无需改动
  oracle:
    image: docker.xuanyuan.run/gvenzl/oracle-free:23-slim
    container_name: oracle
    restart: always
    environment:
      ORACLE_PASSWORD: Oracle123!
      ORACLE_DATABASE: XEPDB1
      APP_USER: appuser
      APP_USER_PASSWORD: App123!
    volumes:
      - oracle-data:/opt/oracle/oradata
    ports:
      - "1521:1521"
    shm_size: 1g
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # Nginx 外置硬盘挂载
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    volumes:
      - /Volumes/ORICO2T/Users/sinvigil/mount/nginx/conf:/etc/nginx/conf.d
      - /Volumes/ORICO2T/Users/sinvigil/mount/nginx/html:/usr/share/nginx/html
      - /Volumes/ORICO2T/Users/sinvigil/mount/nginx/logs:/var/log/nginx
      - /Volumes/ORICO2T/Users/sinvigil/mount/nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-net
    depends_on:
      - mysql
      - postgres
      - oracle

networks:
  app-net:
    driver: bridge
volumes:
  oracle-data:
  opengauss-data:
