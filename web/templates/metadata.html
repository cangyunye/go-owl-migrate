{{template "base.html" .}}
{{define "content"}}
<div class="page-head reveal" style="--i:0">
    <div>
        <div class="overline">prepare · metadata</div>
        <h1>元数据</h1>
        <p class="subtitle">指定元数据来源并加载表结构，供 DDL / SELECT 生成与校验使用</p>
    </div>
</div>

<div class="panel reveal" style="--i:1">
    <div class="panel-head"><span class="panel-title">元数据来源</span></div>
    <div class="field">
        <label>来源类型</label>
        <select id="m-type" onchange="toggleMetaFields()">
            <option value="csv">CSV 目录</option>
            <option value="xlsx">XLSX 文件</option>
            <option value="database">数据库</option>
        </select>
    </div>
    <div class="field" id="f-csv">
        <label>CSV 元数据目录</label>
        <input type="text" id="m-csv-path" class="mono" value="./testdata/csv/">
        <div class="field-help">包含 <code>tables.csv</code> / <code>columns.csv</code> 等的目录</div>
    </div>
    <div class="field hidden" id="f-xlsx">
        <label>XLSX 文件路径</label>
        <input type="text" id="m-xlsx-path" class="mono" value="./metadata/schema.xlsx">
    </div>
    <div class="field hidden" id="f-db-type">
        <label>数据库类型</label>
        <select id="m-src-type"></select>
    </div>
    <div class="field hidden" id="f-db-dsn">
        <label>数据库 DSN</label>
        <input type="text" id="m-src-dsn" class="mono">
        <div class="field-help" id="m-dsn-hint"></div>
    </div>
    <div class="field hidden" id="f-db-schema">
        <label>Schema</label>
        <input type="text" id="m-src-schema" class="mono">
    </div>
    <div class="form-actions">
        <button class="btn-primary" onclick="loadMeta()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M8 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4"/></svg>
            加载元数据
        </button>
        <button class="btn-ghost" onclick="validateMeta()">校验</button>
        <span id="meta-status" class="status-msg"></span>
    </div>
</div>

<div class="panel reveal" style="--i:2" id="tables-panel" style="display:none">
    <div class="panel-head">
        <span class="panel-title">表列表 <span class="badge badge-accent" id="table-count"></span></span>
    </div>
    <table class="data-table">
        <thead><tr><th>Schema</th><th>表名</th><th>列数</th><th>主键</th><th></th></tr></thead>
        <tbody id="tables-body"></tbody>
    </table>
</div>

<div class="panel reveal" style="--i:3" id="detail-panel" style="display:none">
    <div class="panel-head"><span class="panel-title" id="detail-title">表详情</span></div>
    <div id="detail-content"></div>
</div>

<div class="panel reveal" style="--i:4" id="validate-panel" style="display:none">
    <div class="panel-head">
        <span class="panel-title">校验结果 <span class="badge" id="validate-count"></span></span>
    </div>
    <ul id="validate-list" class="validate-list"></ul>
</div>
{{end}}
{{define "scripts"}}
<script>
let dsnExamples = {};

(async function initMetaForm() {
    const data = await api.get('/api/v1/scenarios');
    dsnExamples = data.dsn_examples || {};
    const dialects = (data.scenarios[0].fields.find(f => f.name === 'source_type') || {}).options || [];
    const sel = document.getElementById('m-src-type');
    dialects.forEach(d => { const o = document.createElement('option'); o.value = d; o.textContent = d; sel.appendChild(o); });

    try {
        const cfg = await api.get('/api/v1/config');
        if (cfg.metadata && cfg.metadata.type) document.getElementById('m-type').value = cfg.metadata.type;
        if (cfg.metadata && cfg.metadata.csv && cfg.metadata.csv.path) document.getElementById('m-csv-path').value = cfg.metadata.csv.path;
        if (cfg.metadata && cfg.metadata.xlsx && cfg.metadata.xlsx.path) document.getElementById('m-xlsx-path').value = cfg.metadata.xlsx.path;
        if (cfg.source) {
            if (cfg.source.type) sel.value = cfg.source.type;
            if (cfg.source.dsn) document.getElementById('m-src-dsn').value = cfg.source.dsn;
            if (cfg.source.schema) document.getElementById('m-src-schema').value = cfg.source.schema;
        }
    } catch (e) {}
    toggleMetaFields();
    sel.addEventListener('change', updateDsnHint);
    updateDsnHint();
})();

function toggleMetaFields() {
    const type = document.getElementById('m-type').value;
    document.getElementById('f-csv').classList.toggle('hidden', type !== 'csv');
    document.getElementById('f-xlsx').classList.toggle('hidden', type !== 'xlsx');
    const isDB = type === 'database';
    ['f-db-type', 'f-db-dsn', 'f-db-schema'].forEach(id =>
        document.getElementById(id).classList.toggle('hidden', !isDB));
}

function updateDsnHint() {
    const dialect = document.getElementById('m-src-type').value;
    const hint = document.getElementById('m-dsn-hint');
    hint.textContent = dsnExamples[dialect] ? '格式示例：' + dsnExamples[dialect] : '';
    hint.classList.toggle('has-example', !!dsnExamples[dialect]);
}

function buildMetaPayload() {
    const type = document.getElementById('m-type').value;
    const payload = { metadata: { type: type }, source: {} };
    if (type === 'csv') {
        payload.metadata.csv = { path: document.getElementById('m-csv-path').value, column_name_matching: 'case_insensitive' };
    } else if (type === 'xlsx') {
        payload.metadata.xlsx = { path: document.getElementById('m-xlsx-path').value };
    } else {
        payload.source = {
            type: document.getElementById('m-src-type').value,
            dsn: document.getElementById('m-src-dsn').value,
            schema: document.getElementById('m-src-schema').value,
        };
    }
    return payload;
}

async function loadMeta() {
    const status = document.getElementById('meta-status');
    status.textContent = '加载中…'; status.className = 'status-msg';
    try {
        const resp = await api.post('/api/v1/metadata/load', buildMetaPayload());
        document.getElementById('tables-panel').style.display = 'block';
        document.getElementById('table-count').textContent = resp.table_count + ' 张表';
        renderTables();
        status.textContent = '✓ 已加载 ' + resp.table_count + ' 张表'; status.className = 'status-msg ok';
        toast.ok('元数据加载完成', resp.table_count + ' 张表');
    } catch (e) {
        status.textContent = '✗ ' + e.message; status.className = 'status-msg fail';
        toast.err('加载失败', e.message);
    }
}

async function renderTables() {
    const tables = await api.get('/api/v1/metadata/tables');
    const tbody = document.getElementById('tables-body');
    tbody.innerHTML = '';
    tables.forEach(t => {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td class="mono">' + t.schema + '</td>' +
            '<td class="mono" style="color:var(--text);font-weight:600">' + t.name + '</td>' +
            '<td class="mono">' + t.columns.length + '</td>' +
            '<td class="mono" style="color:var(--text-2)">' + ((t.primary_key || []).join(', ') || '—') + '</td>' +
            '<td><a href="#" onclick="showDetail(\'' + t.schema + '\',\'' + t.name + '\');return false;">详情</a></td>';
        tbody.appendChild(tr);
    });
}

async function showDetail(schema, name) {
    const d = await api.get('/api/v1/metadata/tables/' + schema + '/' + name);
    document.getElementById('detail-panel').style.display = 'block';
    document.getElementById('detail-title').textContent = schema + '.' + name;
    let html = '<table class="data-table"><thead><tr><th>列名</th><th>类型</th><th>可空</th><th>默认值</th></tr></thead><tbody>';
    d.columns.forEach(c => {
        html += '<tr><td class="mono" style="font-weight:600">' + c.name + '</td>' +
            '<td class="mono" style="color:var(--cyan)">' + c.type + (c.length ? '(' + c.length + ')' : '') + '</td>' +
            '<td>' + (c.nullable ? '<span class="st-ok">是</span>' : '<span style="color:var(--text-3)">否</span>') + '</td>' +
            '<td class="mono" style="color:var(--text-2)">' + (c.default || '—') + '</td></tr>';
    });
    html += '</tbody></table>';
    html += '<p class="field-help" style="margin-top:12px">主键：<span class="mono" style="color:var(--amber)">' + ((d.primary_keys || []).join(', ') || '无') + '</span></p>';
    document.getElementById('detail-content').innerHTML = html;
    document.getElementById('detail-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function validateMeta() {
    const status = document.getElementById('meta-status');
    try {
        const resp = await api.get('/api/v1/metadata/validate');
        document.getElementById('validate-panel').style.display = 'block';
        document.getElementById('validate-count').textContent = resp.count + ' 项';
        const ul = document.getElementById('validate-list');
        ul.innerHTML = '';
        (resp.errors || []).forEach((e, i) => {
            const li = document.createElement('li');
            li.className = 'sev-' + (e.severity || 'info');
            li.style.animationDelay = (i * 40) + 'ms';
            li.textContent = '[' + e.severity + '] ' + e.message;
            ul.appendChild(li);
        });
        if (resp.count === 0) ul.innerHTML = '<li class="sev-info">✓ 无校验问题</li>';
    } catch (e) {
        status.textContent = '✗ ' + e.message; status.className = 'status-msg fail';
        toast.err('校验失败', e.message);
    }
}
</script>
{{end}}
