{{template "base.html" .}}
{{define "content"}}
<h1>数据迁移</h1>
<p class="subtitle">端到端迁移：源库 → 导出 → 目标库（或生成 INSERT SQL）</p>

<nav class="mode-tabs">
    <a href="/migrate?mode=direct" class="mode-tab" data-mode="direct">直接迁移</a>
    <a href="/migrate?mode=sql" class="mode-tab" data-mode="sql">SQL 输出</a>
</nav>
<p class="mode-desc" id="mode-desc"></p>

<div class="panel">
    <button class="btn-primary" id="btn-start" onclick="startMigrate()">开始迁移</button>
    <button class="btn-danger" id="btn-cancel" onclick="jobUI.cancel()" style="display:none">取消</button>
</div>
<div id="progress-panel" class="panel" style="display:none">
    <h3>进度 <span class="badge" id="job-id-badge"></span></h3>
    <div id="progress-log" class="log-box"></div>
</div>
{{end}}
{{define "scripts"}}
<script>
jobUI.bind('#progress-log');
const mode = (new URLSearchParams(location.search).get('mode') === 'sql') ? 'sql-out' : 'direct';
document.querySelectorAll('.mode-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.mode === (mode === 'sql-out' ? 'sql' : 'direct')));
document.getElementById('mode-desc').textContent = (mode === 'sql-out')
    ? 'SQL 输出模式：导出后生成 INSERT SQL 文件，不连接目标库。'
    : '直接模式：导出 CSV 后直接导入目标数据库。';

async function startMigrate() {
    try { await jobUI.start('/api/v1/migrate', { mode: mode }); }
    catch (e) { alert('启动失败: ' + e.message); }
}
</script>
{{end}}
