{{template "base.html" .}}
{{define "content"}}
<div class="page-head reveal" style="--i:0">
    <div>
        <div class="overline">generate · ddl</div>
        <h1>生成 DDL</h1>
        <p class="subtitle">从已加载的元数据生成目标库建表语句 — 需先在「元数据」页加载</p>
    </div>
</div>

<div class="gen-layout">
    <aside class="panel gen-side reveal" style="--i:1">
        <div class="panel-head"><span class="panel-title">生成选项</span></div>
        <div class="field">
            <label class="check"><input type="checkbox" id="opt-no-quote"> 不引用标识符 <code>no_quote_identifiers</code></label>
        </div>
        <div class="form-actions" style="border-top:none;margin-top:8px;padding-top:0">
            <button class="btn-primary" id="btn-gen" onclick="generate()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                生成 DDL
            </button>
            <span id="gen-status" class="status-msg"></span>
        </div>
    </aside>

    <section class="reveal" style="--i:2">
        <div class="code-box">
            <div class="code-head">
                <span class="code-title">输出 <span class="badge badge-accent" id="file-count" style="display:none"></span></span>
                <a class="btn-ghost btn-sm" id="btn-download" href="/api/v1/ddl/download" style="display:none">下载全部 (ZIP)</a>
            </div>
            <div class="file-tabs" id="file-list" style="padding:12px 14px 0"></div>
            <pre class="sql-view" id="sql-preview"><span class="gen-empty" style="height:380px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m10 12-2 2 2 2"/><path d="m14 12 2 2-2 2"/></svg><span>点击「生成 DDL」后在此预览 SQL</span></span></pre>
        </div>
    </section>
</div>
{{end}}
{{define "scripts"}}
<script>
async function generate() {
    const status = document.getElementById('gen-status');
    const btn = document.getElementById('btn-gen');
    status.textContent = '生成中…'; status.className = 'status-msg';
    btn.disabled = true;
    try {
        const resp = await api.post('/api/v1/ddl/generate', {
            no_quote_identifiers: document.getElementById('opt-no-quote').checked ? true : null,
        });
        const fc = document.getElementById('file-count');
        fc.style.display = 'inline-flex';
        fc.textContent = resp.count + ' 个文件';
        document.getElementById('btn-download').style.display = 'inline-flex';
        renderGenFiles(resp.files, document.getElementById('file-list'), document.getElementById('sql-preview'));
        status.textContent = '✓ ' + resp.count + ' 个文件'; status.className = 'status-msg ok';
        toast.ok('DDL 生成完成', resp.count + ' 个文件');
    } catch (e) {
        status.textContent = '✗ ' + e.message; status.className = 'status-msg fail';
        toast.err('生成失败', e.message);
    } finally { btn.disabled = false; }
}
</script>
{{end}}
