{{template "base.html" .}}
{{define "content"}}
<h1>数据库迁移工具</h1>
<p class="subtitle">选择操作场景开始</p>
<div class="cards">
    <a href="/config?scenario=migrate" class="card">
        <h3>完整迁移</h3>
        <p>源库 → 导出 → 目标库，端到端自动完成</p>
    </a>
    <a href="/config?scenario=export-ddl" class="card">
        <h3>生成 DDL</h3>
        <p>从元数据生成目标库建表语句</p>
    </a>
    <a href="/config?scenario=export" class="card">
        <h3>导出数据</h3>
        <p>从源库导出 CSV/SQL/XLSX 文件</p>
    </a>
    <a href="/config?scenario=import" class="card">
        <h3>导入数据</h3>
        <p>将 CSV 文件导入目标数据库</p>
    </a>
    <a href="/config?scenario=gen-select" class="card">
        <h3>生成 SELECT</h3>
        <p>生成分页查询语句用于手动导出</p>
    </a>
    <a href="/config?scenario=export-insert" class="card">
        <h3>生成 INSERT</h3>
        <p>从 CSV 生成 INSERT SQL 文件</p>
    </a>
</div>
{{end}}
