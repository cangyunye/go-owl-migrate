{{template "base.html" .}}
{{define "content"}}
<div class="page-head reveal" style="--i:0">
    <div>
        <div class="overline">monitor · jobs</div>
        <h1>任务历史</h1>
        <p class="subtitle">迁移 / 导出 / 导入任务的执行记录 — 支持检查点恢复</p>
    </div>
    <div class="panel-actions">
        <span class="live-dot" title="自动刷新"></span>
        <button class="btn-ghost btn-sm" onclick="loadJobs()">刷新</button>
    </div>
</div>

<nav class="tabs reveal" style="--i:1" id="filter-tabs">
    <a href="#" class="tab active" data-filter="all" onclick="setFilter('all');return false;">全部</a>
    <a href="#" class="tab" data-filter="running" onclick="setFilter('running');return false;">运行中</a>
    <a href="#" class="tab" data-filter="completed" onclick="setFilter('completed');return false;">已完成</a>
    <a href="#" class="tab" data-filter="failed" onclick="setFilter('failed');return false;">失败 / 中断</a>
</nav>

<div class="reveal" style="--i:2">
    <table class="data-table" id="jobs-table">
        <thead>
            <tr><th>ID</th><th>类型</th><th>状态</th><th>PID</th><th>创建时间</th><th>完成时间</th></tr>
        </thead>
        <tbody id="jobs-body"><tr><td colspan="6" style="text-align:center;color:var(--text-3);padding:20px">加载中…</td></tr></tbody>
    </table>
</div>
{{end}}
{{define "scripts"}}
<script>
let allJobs = [];
let currentFilter = 'all';

function statusBadge(s) {
    const map = {
        running: ['st-run', true], cancelling: ['st-warn', true],
        completed: ['st-ok', false], failed: ['st-fail', false],
        interrupted: ['st-warn', false], cancelled: ['st-warn', false]
    };
    const m = map[s] || ['st-run', false];
    return '<span class="' + m[0] + '"><span class="status-dot' + (m[1] ? ' pulse' : '') + '"></span>' + s + '</span>';
}

function matches(j) {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'running') return j.status === 'running' || j.status === 'cancelling';
    if (currentFilter === 'completed') return j.status === 'completed';
    if (currentFilter === 'failed') return j.status === 'failed' || j.status === 'interrupted' || j.status === 'cancelled';
    return true;
}

function render() {
    const tbody = document.getElementById('jobs-body');
    const rows = allJobs.filter(matches);
    if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-3);padding:20px">无匹配任务</td></tr>';
        return;
    }
    tbody.innerHTML = rows.map(j =>
        '<tr><td class="mono"><a href="/jobs/' + j.job_id + '">' + j.job_id + '</a></td>' +
        '<td class="mono">' + j.type + '</td>' +
        '<td>' + statusBadge(j.status) + '</td>' +
        '<td class="mono" style="color:var(--text-2)">' + (j.pid || '—') + '</td>' +
        '<td class="mono" style="color:var(--text-2)">' + (j.created_at || '') + '</td>' +
        '<td class="mono" style="color:var(--text-2)">' + (j.finished_at || '—') + '</td></tr>'
    ).join('');
}

function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('#filter-tabs .tab').forEach(t =>
        t.classList.toggle('active', t.dataset.filter === f));
    render();
}

async function loadJobs() {
    try {
        allJobs = await api.get('/api/v1/jobs') || [];
        render();
    } catch (e) { /* best-effort */ }
}

loadJobs();
setInterval(loadJobs, 5000);
</script>
{{end}}
