{{template "base.html" .}}
{{define "content"}}
<h1>导入数据</h1>
<p class="subtitle">将 CSV 数据导入目标库（使用当前配置的 import 与 target 段）</p>
<div class="panel">
    <button class="btn-primary" id="btn-start" onclick="startImport()">开始导入</button>
    <button class="btn-danger" id="btn-cancel" onclick="jobUI.cancel()" style="display:none">取消</button>
</div>
<div id="progress-panel" class="panel" style="display:none">
    <h3>进度 <span class="badge" id="job-id-badge"></span></h3>
    <div id="progress-log" class="log-box"></div>
</div>
{{end}}
{{define "scripts"}}
<script>
jobUI.bind('#progress-log');
async function startImport() {
    try { await jobUI.start('/api/v1/import', {}); }
    catch (e) { alert('启动失败: ' + e.message); }
}
</script>
{{end}}
