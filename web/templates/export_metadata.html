{{template "base.html" .}}
{{define "content"}}
<div class="page-head reveal" style="--i:0">
    <div>
        <div class="overline">prepare · extract</div>
        <h1>元数据导出</h1>
        <p class="subtitle">从源库提取元数据并导出为 CSV / SQL 文件 — 供离线迁移使用</p>
    </div>
</div>

<div class="panel reveal" style="--i:1">
    <div class="panel-head"><span class="panel-title">导出参数</span></div>
    <div class="field">
        <label>数据库类型</label>
        <select id="em-src-type"></select>
    </div>
    <div class="field">
        <label>DSN</label>
        <input type="text" id="em-src-dsn" class="mono" placeholder="user/pass@host:port/service">
        <div class="field-help" id="em-dsn-hint"></div>
    </div>
    <div class="field">
        <label>Schema</label>
        <input type="text" id="em-src-schema" class="mono" placeholder="SCOTT">
    </div>
    <div class="field">
        <label>导出格式</label>
        <select id="em-format">
            <option value="csv">CSV（多文件）</option>
            <option value="sql">SQL（INSERT 语句）</option>
        </select>
    </div>
    <div class="field">
        <label>范围</label>
        <input type="text" id="em-scope" class="mono" value="all" placeholder="all / schema:NAME / table:T1,T2">
        <div class="field-help"><code>all</code> = 整个 schema · <code>schema:NAME</code> = 指定 schema · <code>table:T1,T2</code> = 指定表</div>
    </div>
    <div class="form-actions">
        <button class="btn-primary" id="btn-export" onclick="doExport()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            导出元数据
        </button>
        <span id="em-status" class="status-msg"></span>
    </div>
</div>

<div class="panel reveal" style="--i:2" id="em-result" style="display:none">
    <div class="panel-head">
        <span class="panel-title">导出结果 <span class="badge badge-green" id="em-count"></span></span>
        <a id="em-download" class="btn-primary btn-sm" href="/api/v1/metadata/export/download">下载 ZIP</a>
    </div>
    <div id="em-files"></div>
</div>
{{end}}
{{define "scripts"}}
<script>
let dsnExamples = {};
(async function init() {
    const data = await api.get('/api/v1/scenarios');
    dsnExamples = data.dsn_examples || {};
    const dialects = (data.scenarios[0].fields.find(f => f.name === 'source_type') || {}).options || [];
    const sel = document.getElementById('em-src-type');
    dialects.forEach(d => { const o = document.createElement('option'); o.value = d; o.textContent = d; sel.appendChild(o); });

    try {
        const cfg = await api.get('/api/v1/config');
        if (cfg.source) {
            if (cfg.source.type) sel.value = cfg.source.type;
            if (cfg.source.dsn) document.getElementById('em-src-dsn').value = cfg.source.dsn;
            if (cfg.source.schema) document.getElementById('em-src-schema').value = cfg.source.schema;
        }
    } catch (e) {}
    sel.addEventListener('change', updateHint);
    updateHint();
})();

function updateHint() {
    const dialect = document.getElementById('em-src-type').value;
    const hint = document.getElementById('em-dsn-hint');
    hint.textContent = dsnExamples[dialect] ? '格式示例：' + dsnExamples[dialect] : '';
    hint.classList.toggle('has-example', !!dsnExamples[dialect]);
}

async function doExport() {
    const status = document.getElementById('em-status');
    status.textContent = '导出中…'; status.className = 'status-msg';
    document.getElementById('btn-export').disabled = true;
    try {
        const resp = await api.post('/api/v1/metadata/export', {
            source: {
                type: document.getElementById('em-src-type').value,
                dsn: document.getElementById('em-src-dsn').value,
                schema: document.getElementById('em-src-schema').value,
            },
            format: document.getElementById('em-format').value,
            scope: document.getElementById('em-scope').value,
        });
        document.getElementById('em-result').style.display = 'block';
        document.getElementById('em-count').textContent = resp.table_count + ' 张表 · ' + resp.count + ' 个文件';
        const div = document.getElementById('em-files');
        div.innerHTML = '<div class="file-tabs">' + (resp.files || []).map(f =>
            '<span class="file-tab" title="' + (f.content || '').length + ' bytes">' + f.name + '</span>').join('') + '</div>';
        status.textContent = '✓ 导出完成'; status.className = 'status-msg ok';
        toast.ok('元数据导出完成', resp.table_count + ' 张表，' + resp.count + ' 个文件');
    } catch (e) {
        status.textContent = '✗ ' + e.message; status.className = 'status-msg fail';
        toast.err('导出失败', e.message);
    } finally {
        document.getElementById('btn-export').disabled = false;
    }
}
</script>
{{end}}
