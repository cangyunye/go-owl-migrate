{{template "base.html" .}}
{{define "content"}}
<div class="cfg-head">
    <h1>配置</h1>
    <p class="subtitle">选择场景，填写表单，实时生成配置</p>
</div>

<nav class="scenario-pills" id="scenario-pills"></nav>

<div class="cfg-layout">
    <section class="panel cfg-form-panel">
        <div class="panel-title-row">
            <h3 id="scenario-label">—</h3>
            <code class="cmd-badge" id="scenario-cmd"></code>
        </div>
        <p class="scenario-desc" id="scenario-desc"></p>
        <form id="cfg-form" autocomplete="off"></form>
        <div class="form-actions">
            <button type="button" class="btn-primary" id="btn-save">保存为当前配置</button>
            <span class="save-status" id="save-status"></span>
        </div>
    </section>

    <aside class="panel cfg-preview-panel">
        <div class="panel-title-row">
            <h3>配置预览</h3>
            <span class="live-dot" id="live-dot"></span>
        </div>
        <pre class="yaml-preview" id="yaml-preview"><span class="yaml-hint">填写左侧表单后，这里实时显示生成的 YAML…</span></pre>
    </aside>
</div>
{{end}}
{{define "scripts"}}
<script src="/static/js/config.js"></script>
{{end}}
